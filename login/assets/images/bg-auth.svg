<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#e9f7f2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1976d2" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00acc1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#26a69a" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- Soft abstract shapes -->
  <g filter="url(#soft)">
    <circle cx="350" cy="250" r="180" fill="url(#g2)"/>
    <circle cx="1650" cy="220" r="220" fill="url(#g3)"/>
    <circle cx="1550" cy="900" r="260" fill="url(#g2)"/>
    <circle cx="420" cy="880" r="220" fill="url(#g3)"/>
  </g>

  <!-- Single subtle job icon (briefcase) -->
  <g stroke="#1565c0" stroke-opacity="0.18" fill="#1565c0" fill-opacity="0.08">
    <g transform="translate(1700,900) scale(1.4)">
      <rect x="-110" y="-60" width="220" height="150" rx="14"/>
      <rect x="-46" y="-96" width="92" height="36" rx="7"/>
      <line x1="-110" y1="-20" x2="110" y2="-20" stroke-width="6"/>
      <circle cx="-20" cy="-20" r="6"/>
      <circle cx="20" cy="-20" r="6"/>
    </g>
  </g>

  <!-- Light grid for structure -->
  <g stroke="#0d47a1" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 120 H1920"/>
    <path d="M0 360 H1920"/>
    <path d="M0 600 H1920"/>
    <path d="M0 840 H1920"/>
    <path d="M240 0 V1080"/>
    <path d="M720 0 V1080"/>
    <path d="M1200 0 V1080"/>
    <path d="M1680 0 V1080"/>
  </g>

  <!-- Branding text (very subtle watermark) -->
  <text x="50%" y="92%" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="40" fill="#0d47a1" fill-opacity="0.06">Jobir Jobs</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#f3f9f6"/>
    </linearGradient>

    <!-- Brand waves -->
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1976d2" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="waveTeal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#26a69a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00acc1" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Soft blur filter for blobs -->
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Base fill -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Ambient blurred blobs -->
  <g filter="url(#blurSoft)">
    <circle cx="280" cy="220" r="180" fill="url(#waveBlue)"/>
    <circle cx="1680" cy="260" r="240" fill="url(#waveTeal)"/>
    <circle cx="1560" cy="900" r="260" fill="url(#waveBlue)"/>
    <circle cx="420" cy="880" r="220" fill="url(#waveTeal)"/>
  </g>

  <!-- Layered waves top -->
  <g>
    <path d="M0,0 C360,80 720,20 1080,80 C1440,140 1680,60 1920,120 L1920,0 Z" fill="url(#waveBlue)"/>
    <path d="M0,0 C420,120 900,40 1320,120 C1620,180 1780,120 1920,160 L1920,0 Z" fill="url(#waveTeal)"/>
  </g>

  <!-- Layered waves bottom -->
  <g>
    <path d="M0,1080 C320,1000 720,1060 1080,1000 C1440,940 1680,1020 1920,960 L1920,1080 Z" fill="url(#waveTeal)"/>
    <path d="M0,1080 C420,960 900,1040 1320,960 C1620,900 1780,960 1920,920 L1920,1080 Z" fill="url(#waveBlue)"/>
  </g>

  <!-- Minimal watermark -->
  <text x="50%" y="94%" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" fill="#0d47a1" fill-opacity="0.05">Jobir Jobs</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#f1f8f6"/>
    </linearGradient>
    <linearGradient id="brand1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1976d2" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#26a69a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00acc1" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Soft ambient blobs -->
  <g filter="url(#blurSoft)">
    <circle cx="260" cy="220" r="180" fill="url(#brand1)"/>
    <circle cx="1680" cy="240" r="220" fill="url(#brand2)"/>
    <circle cx="1580" cy="900" r="260" fill="url(#brand1)"/>
    <circle cx="420" cy="880" r="220" fill="url(#brand2)"/>
  </g>

  <!-- Single, subtle job icon (briefcase) in brand color -->
  <g stroke="#1565c0" stroke-opacity="0.22" fill="#1565c0" fill-opacity="0.10">
    <g transform="translate(1700,900) scale(1.6)">
      <rect x="-120" y="-60" width="240" height="160" rx="16"/>
      <rect x="-50" y="-100" width="100" height="40" rx="8"/>
      <line x1="-120" y1="-20" x2="120" y2="-20" stroke-width="6"/>
      <circle cx="-20" cy="-20" r="7"/>
      <circle cx="20" cy="-20" r="7"/>
    </g>
  </g>

  <!-- Subtle grid for structure -->
  <g stroke="#0d47a1" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 120 H1920"/>
    <path d="M0 360 H1920"/>
    <path d="M0 600 H1920"/>
    <path d="M0 840 H1920"/>
    <path d="M240 0 V1080"/>
    <path d="M720 0 V1080"/>
    <path d="M1200 0 V1080"/>
    <path d="M1680 0 V1080"/>
  </g>

  <!-- Watermark branding -->
  <text x="50%" y="94%" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" fill="#0d47a1" fill-opacity="0.06">Jobir Jobs</text>
</svg>
